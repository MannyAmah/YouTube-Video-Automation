services:
  - type: web
    name: youtube-automation-agent
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: youtube-automation-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3456
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/youtube_automation.db
      - key: DEFAULT_PRIVACY_STATUS
        value: private
      - key: YOUTUBE_REGION
        value: US
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REPLICATE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
